spring.thymeleaf.cache=false

# Templates refresh immediately while we are developing the project

# Local H2 demo database. Use application-local.properties for private PostgreSQL settings.
spring.datasource.url=jdbc:h2:mem:bettercare-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081
spring.sql.init.mode=always

# Email settings. The app starts without real credentials; set env vars to send mail.
spring.mail.host=${BETTERCARE_MAIL_HOST:localhost}
spring.mail.port=${BETTERCARE_MAIL_PORT:1025}
spring.mail.username=${BETTERCARE_MAIL_USERNAME:}
spring.mail.password=${BETTERCARE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${BETTERCARE_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${BETTERCARE_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${BETTERCARE_MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties[mail.smtp.connectiontimeout]=${BETTERCARE_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties[mail.smtp.timeout]=${BETTERCARE_MAIL_TIMEOUT:5000}
spring.mail.properties[mail.smtp.writetimeout]=${BETTERCARE_MAIL_WRITE_TIMEOUT:5000}
bettercare.from=${BETTERCARE_MAIL_FROM:BetterCare <no-reply@bettercare.local>}
bettercare.base-url=${BETTERCARE_BASE_URL:http://localhost:8081}

# Keep the mail indicator active in every environment. In demo mode it will
# report the local SMTP service as unavailable until one is started, making
# mail-delivery problems visible at /actuator/health.
management.health.mail.enabled=true